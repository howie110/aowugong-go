name: Test and release Linux artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANALYTICS_TEST_DSN: postgres://postgres:test-only@127.0.0.1:5432/analytics_test?sslmode=disable
      TRAJECTORY_TEST_DSN: postgres://postgres:test-only@127.0.0.1:5432/analytics_test?sslmode=disable
      CHAT_ARCHIVE_TEST_DSN: postgres://postgres:test-only@127.0.0.1:5432/chat_archive_test?sslmode=disable
      CHAT_ARCHIVE_TEST_PYTHON: python3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare isolated integration databases
        env:
          PGPASSWORD: test-only
        run: |
          createdb -h 127.0.0.1 -U postgres analytics_test
          createdb -h 127.0.0.1 -U postgres chat_archive_test
          python3 -m pip install -r skills/chat-archive-sync/scripts/requirements.txt

      - name: Require PostgreSQL integration tests without skips
        run: |
          go test -count=1 -p 1 -json ./internal/analytics ./internal/trajectory ./internal/chatarchive ./internal/httpserver -run 'Test(Postgres|StatisticsLargeArchive|ChatArchivePythonHTTPRoundTrip|ChatArchiveReconcileCLI)' > /tmp/postgres-tests.jsonl || { cat /tmp/postgres-tests.jsonl; exit 1; }
          python3 - <<'PYTHON'
          import json
          events = [json.loads(line) for line in open('/tmp/postgres-tests.jsonl')]
          passed = [e['Test'] for e in events if e.get('Test') and e['Action'] == 'pass']
          skipped = [e['Test'] for e in events if e.get('Test') and e['Action'] == 'skip']
          required = {'TestPostgresCollectionAndReport', 'TestPostgresTrajectoryLifecycle', 'TestPostgresArchiveQueriesAndExport', 'TestChatArchivePythonHTTPRoundTrip', 'TestChatArchiveReconcileCLI'}
          assert required.issubset(passed) and not skipped, f"Integration coverage missing: passed={passed}, skipped={skipped}"
          print(f"PostgreSQL integration tests passed: {len(passed)}; skipped: 0")
          PYTHON

      - name: Verify release tooling
        run: node --test scripts/tests/*.test.mjs

      - name: Verify and build release
        run: node scripts/build-release.mjs "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME}"
          package="aowugong-go-${version}-linux-amd64"
          gh release create "${version}" \
            "dist/${package}.tar.gz" \
            "dist/${package}.tar.gz.sha256" \
            --verify-tag --generate-notes --title "${version}"
